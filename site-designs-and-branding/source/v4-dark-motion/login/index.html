<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Baseline Analytics · Investor Portal</title>
<style>
 @font-face { font-family: 'GT America'; src: url('../../brand_source/fonts_2/GT-America-Standard-Light-Trial.otf') format('opentype'); font-weight: 300; }
 @font-face { font-family: 'GT America'; src: url('../../brand_source/fonts_2/GT-America-Standard-Regular-Trial.otf') format('opentype'); font-weight: 400; }
 @font-face { font-family: 'GT America'; src: url('../../brand_source/fonts_2/GT-America-Standard-Medium-Trial.otf') format('opentype'); font-weight: 500; }
 @font-face { font-family: 'GT America Mono'; src: url('../../brand_source/fonts_1/GT-America-Mono-Regular-Trial.otf') format('opentype'); font-weight: 400; }
 @font-face { font-family: 'GT America Mono'; src: url('../../brand_source/fonts_1/GT-America-Mono-Medium-Trial.otf') format('opentype'); font-weight: 500; }

 :root {
 --black: #000; --onyx: #121211;
 --gold: #FFC655; --gold-mid: #AE8E51;
 --mercury: #E5E5E5; --mercury-dim: rgba(229,229,229,0.62);
 --mercury-faint: rgba(229,229,229,0.32);
 --hairline: rgba(229,229,229,0.14);
 }

 * { box-sizing: border-box; margin: 0; padding: 0; }
 html, body {
 background: var(--black); color: var(--mercury);
 font-family: 'GT America', -apple-system, sans-serif; font-weight: 300;
 -webkit-font-smoothing: antialiased; overflow: hidden;
 height: 100vh; width: 100vw;
 }
 ::selection { background: var(--gold); color: var(--black); }

 /* Full-bleed video background */
 .bg-video {
 position: fixed; inset: 0; width: 100%; height: 100%;
 object-fit: cover; z-index: 0;
 opacity: 0.55;
 filter: contrast(1.1) brightness(0.9);
 pointer-events: none;
 }
 .bg-overlay {
 position: fixed; inset: 0; z-index: 1; pointer-events: none;
 background:
 radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.7) 100%),
 linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.55) 100%);
 }
 .vignette {
 position: fixed; inset: 0; z-index: 1; pointer-events: none;
 box-shadow: inset 0 0 240px rgba(0,0,0,0.85);
 }

 /* Top masthead */
 .top-bar {
 position: fixed; top: 0; left: 0; right: 0; z-index: 10;
 display: flex; justify-content: space-between; align-items: center;
 padding: 24px 48px;
 }
 .top-bar .brand {
 font-family: 'GT America Mono', monospace; font-size: 10px;
 letter-spacing: 0.26em; color: var(--gold); text-transform: uppercase;
 }
 .top-bar .auth-meta {
 font-family: 'GT America Mono', monospace; font-size: 10px;
 letter-spacing: 0.22em; color: var(--mercury-faint); text-transform: uppercase;
 }

 /* Center stage */
 .stage {
 position: relative; z-index: 5;
 min-height: 100vh; width: 100%;
 display: flex; flex-direction: column; align-items: center; justify-content: center;
 padding: 48px;
 }

 /* Logo */
 .logo-wrap {
 margin-bottom: 48px; opacity: 0;
 animation: logoFade 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
 }
 @keyframes logoFade {
 from { opacity: 0; transform: translateY(12px) scale(0.98); }
 to { opacity: 1; transform: translateY(0) scale(1); }
 }
 .logo-wrap img {
 width: 280px; height: auto; display: block;
 }

 /* Tagline */
 .tagline {
 font-size: 15px; color: var(--mercury-dim); font-weight: 300;
 letter-spacing: -0.005em; font-style: italic;
 margin-bottom: 64px; text-align: center;
 opacity: 0; animation: fadeUp 1.2s ease 0.9s forwards;
 }
 .tagline em { color: var(--gold); font-style: italic; font-weight: 400; }
 @keyframes fadeUp {
 from { opacity: 0; transform: translateY(8px); }
 to { opacity: 1; transform: translateY(0); }
 }

 /* Login card */
 .login-card {
 width: 420px; max-width: 100%;
 background: rgba(18,18,17,0.6);
 border: 1px solid var(--hairline);
 backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
 padding: 36px 36px 32px;
 position: relative;
 opacity: 0; animation: fadeUp 1.2s ease 1.1s forwards;
 }
 .login-card::before {
 content: ''; position: absolute; top: 0; left: 0; right: 0;
 height: 2px; background: var(--gold);
 }
 .login-eyebrow {
 font-family: 'GT America Mono', monospace; font-size: 10px;
 letter-spacing: 0.26em; color: var(--gold); text-transform: uppercase;
 margin-bottom: 14px; text-align: center;
 }
 .login-title {
 font-size: 22px; font-weight: 400; color: var(--mercury);
 letter-spacing: -0.01em; text-align: center; margin-bottom: 6px;
 }
 .login-sub {
 font-family: 'GT America Mono', monospace; font-size: 10px;
 letter-spacing: 0.18em; color: var(--mercury-faint);
 text-transform: uppercase; text-align: center; margin-bottom: 28px;
 }

 .field {
 margin-bottom: 14px;
 }
 .field label {
 display: block; font-family: 'GT America Mono', monospace;
 font-size: 9px; letter-spacing: 0.22em;
 color: var(--mercury-faint); text-transform: uppercase;
 margin-bottom: 6px;
 }
 .field input {
 width: 100%; padding: 14px 16px;
 background: rgba(0,0,0,0.4); border: 1px solid var(--hairline);
 color: var(--mercury); font-family: 'GT America', sans-serif;
 font-size: 14px; font-weight: 300;
 outline: none; transition: border-color 0.2s;
 }
 .field input:focus { border-color: var(--gold); }
 .field input::placeholder { color: var(--mercury-faint); }

 .submit {
 width: 100%; padding: 16px 24px;
 background: var(--gold); color: var(--black); border: none;
 font-family: 'GT America Mono', monospace;
 font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
 font-weight: 500; cursor: pointer;
 transition: all 0.2s; margin-top: 8px;
 text-decoration: none; display: block; text-align: center;
 }
 .submit:hover { background: #ffd37a; }

 .login-footer {
 margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--hairline);
 display: flex; justify-content: space-between; align-items: center;
 }
 .login-footer .left {
 font-family: 'GT America Mono', monospace; font-size: 9px;
 letter-spacing: 0.2em; color: var(--mercury-faint); text-transform: uppercase;
 }
 .login-footer .right {
 font-family: 'GT America Mono', monospace; font-size: 9px;
 letter-spacing: 0.2em; color: var(--gold-mid); text-transform: uppercase;
 text-decoration: none; cursor: pointer;
 }
 .login-footer .right:hover { color: var(--gold); }

 /* Bottom bar */
 .bottom-bar {
 position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
 display: flex; justify-content: space-between; align-items: center;
 padding: 18px 48px;
 font-family: 'GT America Mono', monospace; font-size: 10px;
 letter-spacing: 0.2em; color: var(--mercury-faint); text-transform: uppercase;
 }
 .bottom-bar .tagline-small em { color: var(--gold); font-style: normal; }
</style>
</head>
<body>

<!-- Video background -->
<video class="bg-video" autoplay muted loop playsinline>
 <source src="../../brand_source/video/baseball_impact.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>
<div class="vignette"></div>

<!-- Top -->
<div class="top-bar">
 <div class="brand">Baseline Analytics · Investor Portal</div>
 <div class="auth-meta">Confidential · Invitation Only</div>
</div>

<!-- Center -->
<div class="stage">
 <!-- Logo -->
 <div class="logo-wrap">
 <img src="../../brand_source/Full Stack - Sunglow Shades & Mercury.svg" alt="Baseline Analytics" />
 </div>

 <!-- Tagline -->
 <div class="tagline"><em>Every Athlete</em> Deserves a Baseline.</div>

 <!-- Login card -->
 <div class="login-card">
 <div class="login-eyebrow">Stakeholder Access</div>
 <div class="login-title">Sign in</div>
 <div class="login-sub">Cycle 04 · Mar 24 to Apr 23, 2026</div>

 <div class="field">
 <label for="email">Email</label>
 <input type="email" id="email" placeholder="you@domain.com" />
 </div>
 <div class="field">
 <label for="password">Password</label>
 <input type="password" id="password" placeholder="••••••••" />
 </div>

 <a href="../mission/index.html" class="submit">Enter Portal →</a>

 <div class="login-footer">
 <span class="left">Secure · TLS 1.3</span>
 <a href="#" class="right">Request Access →</a>
 </div>
 </div>
</div>

<!-- Bottom -->
<div class="bottom-bar">
 <div class="tagline-small">Baseline Analytics · <em>2026</em></div>
 <div>Prepared for invited stakeholders</div>
</div>

</body>
</html>
